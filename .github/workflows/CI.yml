# Generated using the wonderful PkgTemplates.jl and altered slightly 
name: CI
on:
  workflow_dispatch: #get a button to trigger it by hand
  push:
    paths: # run CI/CD when the tests change, the dependencies change, or the version changes
    - test/runtests.jl
    - Project.toml
    tags: '*'
  pull_request: # run when pull requests are made
    paths:
    - src/*
    - ext/*
    - test/runtests.jl
    - Manifest.toml
    - Project.toml
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.12'
        os:
          - ubuntu-latest
          - macOS-latest
        arch:
          - x64
        exclude:
          - os: macOS-latest
            arch: x64
        include:
          - os: macOS-latest
            arch: aarch64
            version: '1.12'
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      
      - name: Add CUDA stack (Linux only)
        if: runner.os == 'Linux'
        run: julia --project=. -e 'using Pkg; Pkg.add(["CUDA", "cuFFT"])'
      - name: Add Metal (macOS only)
        if: runner.os == 'macOS'
        run: julia --project=. -e 'using Pkg; Pkg.add("Metal")'
      - uses: julia-actions/julia-runtest@v1
        env:
          GROUP: ${{ runner.os == 'Linux' && 'CUDA' || runner.os == 'macOS' && 'Metal' || 'CPU' }}
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v4
        with:
          file: lcov.info
